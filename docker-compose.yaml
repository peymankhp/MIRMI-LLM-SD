services:
  ollama:
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    networks:
      - internal_net

  mirmi-llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/mirmi-llm/mirmi-llm:${WEBUI_DOCKER_TAG-main}
    container_name: mirmi-llm
    volumes:
      - mirmi-llm:/app/backend/data
    depends_on:
      - ollama
    # Bind only to your LAN IP, not 0.0.0.0
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    networks:
      - internal_net

volumes:
  ollama: {}
  mirmi-llm: {}

networks:
  internal_net:
    driver: bridge
    internal: true