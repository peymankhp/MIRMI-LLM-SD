<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Ollama API Web Interface</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				padding: 20px;
			}

			.container {
				max-width: 1200px;
				margin: 0 auto;
				background: white;
				border-radius: 20px;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
				overflow: hidden;
			}

			.header {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				padding: 30px;
				text-align: center;
			}

			.header h1 {
				font-size: 2.5em;
				margin-bottom: 10px;
			}

			.header p {
				font-size: 1.1em;
				opacity: 0.9;
			}

			.content {
				padding: 30px;
			}

			.section {
				margin-bottom: 30px;
			}

			.section h2 {
				color: #667eea;
				margin-bottom: 15px;
				font-size: 1.5em;
			}

			.model-selector {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 15px;
				margin-bottom: 20px;
			}

			.model-card {
				background: #f8f9fa;
				border: 2px solid #e9ecef;
				border-radius: 10px;
				padding: 15px;
				cursor: pointer;
				transition: all 0.3s;
				text-align: center;
			}

			.model-card:hover {
				border-color: #667eea;
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
			}

			.model-card.active {
				background: #667eea;
				color: white;
				border-color: #667eea;
			}

			.model-name {
				font-weight: bold;
				font-size: 1.1em;
				margin-bottom: 5px;
			}

			.model-size {
				font-size: 0.9em;
				opacity: 0.7;
			}

			.input-group {
				margin-bottom: 20px;
			}

			label {
				display: block;
				margin-bottom: 8px;
				font-weight: 600;
				color: #333;
			}

			textarea,
			input,
			select {
				width: 100%;
				padding: 12px;
				border: 2px solid #e9ecef;
				border-radius: 8px;
				font-size: 1em;
				font-family: inherit;
				transition: border-color 0.3s;
			}

			textarea:focus,
			input:focus,
			select:focus {
				outline: none;
				border-color: #667eea;
			}

			textarea {
				min-height: 120px;
				resize: vertical;
			}

			.button-group {
				display: flex;
				gap: 10px;
				margin-bottom: 20px;
			}

			button {
				flex: 1;
				padding: 15px 30px;
				font-size: 1.1em;
				font-weight: 600;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				transition: all 0.3s;
			}

			.btn-primary {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
			}

			.btn-primary:hover {
				transform: translateY(-2px);
				box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
			}

			.btn-secondary {
				background: #6c757d;
				color: white;
			}

			.btn-secondary:hover {
				background: #5a6268;
			}

			.btn-primary:disabled,
			.btn-secondary:disabled {
				opacity: 0.5;
				cursor: not-allowed;
				transform: none;
			}

			.response-box {
				background: #f8f9fa;
				border: 2px solid #e9ecef;
				border-radius: 8px;
				padding: 20px;
				min-height: 200px;
				white-space: pre-wrap;
				word-wrap: break-word;
				font-family: 'Courier New', monospace;
				line-height: 1.6;
			}

			.loading {
				display: none;
				text-align: center;
				padding: 20px;
			}

			.loading.active {
				display: block;
			}

			.spinner {
				border: 4px solid #f3f3f3;
				border-top: 4px solid #667eea;
				border-radius: 50%;
				width: 40px;
				height: 40px;
				animation: spin 1s linear infinite;
				margin: 0 auto 10px;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			.api-info {
				background: #e7f3ff;
				border-left: 4px solid #667eea;
				padding: 15px;
				border-radius: 5px;
				margin-bottom: 20px;
			}

			.api-info code {
				background: #fff;
				padding: 2px 6px;
				border-radius: 3px;
				font-family: 'Courier New', monospace;
			}

			.stats {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
				gap: 15px;
				margin-top: 20px;
			}

			.stat-card {
				background: #f8f9fa;
				padding: 15px;
				border-radius: 8px;
				text-align: center;
			}

			.stat-value {
				font-size: 1.5em;
				font-weight: bold;
				color: #667eea;
			}

			.stat-label {
				font-size: 0.9em;
				color: #6c757d;
				margin-top: 5px;
			}

			.advanced-options {
				background: #f8f9fa;
				padding: 20px;
				border-radius: 8px;
				margin-top: 20px;
			}

			.options-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 15px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="header">
				<h1>🤖 Ollama API Web Interface</h1>
				<p>Chat with your local AI models through the browser</p>
			</div>

			<div class="content">
				<!-- API Info -->
				<div class="api-info">
					<strong>🔗 API Endpoint:</strong> <code id="apiEndpoint">http://localhost:11434</code
					><br />
					<strong>📡 Status:</strong> <span id="apiStatus">Checking...</span>
				</div>

				<!-- Model Selection -->
				<div class="section">
					<h2>📦 Select Model</h2>
					<div id="modelSelector" class="model-selector">
						<div class="loading active">
							<div class="spinner"></div>
							<p>Loading models...</p>
						</div>
					</div>
				</div>

				<!-- Chat Interface -->
				<div class="section">
					<h2>💬 Chat</h2>

					<div class="input-group">
						<label for="prompt">Your Message:</label>
						<textarea id="prompt" placeholder="Type your message here...">
Hello! Can you introduce yourself?</textarea
						>
					</div>

					<div class="button-group">
						<button class="btn-primary" onclick="sendMessage()" id="sendBtn">
							🚀 Send Message
						</button>
						<button class="btn-secondary" onclick="clearResponse()">🗑️ Clear</button>
					</div>

					<div class="loading" id="loading">
						<div class="spinner"></div>
						<p>Generating response...</p>
					</div>

					<div class="input-group">
						<label>Response:</label>
						<div id="response" class="response-box">Response will appear here...</div>
					</div>

					<!-- Stats -->
					<div class="stats" id="stats" style="display: none">
						<div class="stat-card">
							<div class="stat-value" id="tokenCount">-</div>
							<div class="stat-label">Tokens</div>
						</div>
						<div class="stat-card">
							<div class="stat-value" id="responseTime">-</div>
							<div class="stat-label">Response Time</div>
						</div>
						<div class="stat-card">
							<div class="stat-value" id="modelUsed">-</div>
							<div class="stat-label">Model</div>
						</div>
					</div>
				</div>

				<!-- Advanced Options -->
				<div class="section">
					<h2>⚙️ Advanced Options</h2>
					<div class="advanced-options">
						<div class="options-grid">
							<div class="input-group">
								<label for="temperature">Temperature (0.0 - 2.0):</label>
								<input type="number" id="temperature" value="0.7" min="0" max="2" step="0.1" />
							</div>
							<div class="input-group">
								<label for="maxTokens">Max Tokens:</label>
								<input type="number" id="maxTokens" value="500" min="1" max="4096" />
							</div>
							<div class="input-group">
								<label for="topP">Top P (0.0 - 1.0):</label>
								<input type="number" id="topP" value="0.9" min="0" max="1" step="0.1" />
							</div>
							<div class="input-group">
								<label for="streaming">Streaming:</label>
								<select id="streaming">
									<option value="false">No (Wait for complete response)</option>
									<option value="true">Yes (Real-time streaming)</option>
								</select>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<script>
			let selectedModel = null;
			const API_BASE = 'http://localhost:11434';

			// Load models on page load
			window.addEventListener('DOMContentLoaded', async () => {
				await checkAPIStatus();
				await loadModels();
			});

			// Check API status
			async function checkAPIStatus() {
				try {
					const response = await fetch(`${API_BASE}/api/tags`);
					if (response.ok) {
						document.getElementById('apiStatus').innerHTML =
							'<span style="color: green;">✅ Connected</span>';
					} else {
						document.getElementById('apiStatus').innerHTML =
							'<span style="color: red;">❌ Error</span>';
					}
				} catch (error) {
					document.getElementById('apiStatus').innerHTML =
						'<span style="color: red;">❌ Not accessible</span>';
					alert("Cannot connect to Ollama API. Make sure it's running at " + API_BASE);
				}
			}

			// Load available models
			async function loadModels() {
				try {
					const response = await fetch(`${API_BASE}/api/tags`);
					const data = await response.json();

					const modelSelector = document.getElementById('modelSelector');
					modelSelector.innerHTML = '';

					if (data.models && data.models.length > 0) {
						data.models.forEach((model, index) => {
							const card = document.createElement('div');
							card.className = 'model-card';
							if (index === 0) {
								card.classList.add('active');
								selectedModel = model.name;
							}

							const sizeGB = (model.size / 1e9).toFixed(1);

							card.innerHTML = `
                            <div class="model-name">${model.name}</div>
                            <div class="model-size">${sizeGB} GB</div>
                        `;

							card.onclick = () => selectModel(model.name, card);
							modelSelector.appendChild(card);
						});
					} else {
						modelSelector.innerHTML = '<p>No models found. Please pull a model first.</p>';
					}
				} catch (error) {
					console.error('Error loading models:', error);
					document.getElementById('modelSelector').innerHTML =
						'<p style="color: red;">Error loading models</p>';
				}
			}

			// Select a model
			function selectModel(modelName, cardElement) {
				// Remove active class from all cards
				document.querySelectorAll('.model-card').forEach((card) => {
					card.classList.remove('active');
				});

				// Add active class to selected card
				cardElement.classList.add('active');
				selectedModel = modelName;

				console.log('Selected model:', modelName);
			}

			// Send message to API
			async function sendMessage() {
				if (!selectedModel) {
					alert('Please select a model first');
					return;
				}

				const prompt = document.getElementById('prompt').value;
				if (!prompt.trim()) {
					alert('Please enter a message');
					return;
				}

				const responseBox = document.getElementById('response');
				const loading = document.getElementById('loading');
				const sendBtn = document.getElementById('sendBtn');
				const stats = document.getElementById('stats');

				// Get options
				const temperature = parseFloat(document.getElementById('temperature').value);
				const maxTokens = parseInt(document.getElementById('maxTokens').value);
				const topP = parseFloat(document.getElementById('topP').value);
				const streaming = document.getElementById('streaming').value === 'true';

				// Show loading
				loading.classList.add('active');
				sendBtn.disabled = true;
				responseBox.textContent = '';
				stats.style.display = 'none';

				const startTime = Date.now();

				try {
					if (streaming) {
						// Streaming mode
						const response = await fetch(`${API_BASE}/api/generate`, {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json'
							},
							body: JSON.stringify({
								model: selectedModel,
								prompt: prompt,
								stream: true,
								options: {
									temperature: temperature,
									num_predict: maxTokens,
									top_p: topP
								}
							})
						});

						const reader = response.body.getReader();
						const decoder = new TextDecoder();
						let fullResponse = '';

						while (true) {
							const { done, value } = await reader.read();
							if (done) break;

							const chunk = decoder.decode(value);
							const lines = chunk.split('\n').filter((line) => line.trim());

							for (const line of lines) {
								try {
									const json = JSON.parse(line);
									if (json.response) {
										fullResponse += json.response;
										responseBox.textContent = fullResponse;
									}
								} catch (e) {
									// Ignore parse errors
								}
							}
						}

						const endTime = Date.now();
						showStats(fullResponse, endTime - startTime);
					} else {
						// Non-streaming mode
						const response = await fetch(`${API_BASE}/api/generate`, {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json'
							},
							body: JSON.stringify({
								model: selectedModel,
								prompt: prompt,
								stream: false,
								options: {
									temperature: temperature,
									num_predict: maxTokens,
									top_p: topP
								}
							})
						});

						const data = await response.json();
						const endTime = Date.now();

						responseBox.textContent = data.response;
						showStats(data.response, endTime - startTime);
					}
				} catch (error) {
					console.error('Error:', error);
					responseBox.textContent = 'Error: ' + error.message;
				} finally {
					loading.classList.remove('active');
					sendBtn.disabled = false;
				}
			}

			// Show statistics
			function showStats(response, timeMs) {
				const stats = document.getElementById('stats');
				const tokenCount = response.split(/\s+/).length;
				const timeSec = (timeMs / 1000).toFixed(2);

				document.getElementById('tokenCount').textContent = tokenCount;
				document.getElementById('responseTime').textContent = timeSec + 's';
				document.getElementById('modelUsed').textContent = selectedModel.split(':')[0];

				stats.style.display = 'grid';
			}

			// Clear response
			function clearResponse() {
				document.getElementById('response').textContent = 'Response will appear here...';
				document.getElementById('stats').style.display = 'none';
			}

			// Allow Enter to send (Ctrl+Enter for new line)
			document.getElementById('prompt').addEventListener('keydown', (e) => {
				if (e.key === 'Enter' && !e.ctrlKey && !e.shiftKey) {
					e.preventDefault();
					sendMessage();
				}
			});
		</script>
	</body>
</html>
